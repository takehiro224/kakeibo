<section>
  <h2>記録する</h2>
  <form>
    <div>
      <label for="recorded-on">日付</label>
      <input type="date" id="recorded-on" name="recorded_on" required>
    </div>

    <fieldset>
      <legend>区分</legend>
      <label><input type="radio" name="kind" value="使ったお金" checked> 使ったお金</label>
      <label><input type="radio" name="kind" value="入ったお金"> 入ったお金</label>
    </fieldset>

    <div>
      <label for="category">カテゴリ</label>
      <select id="category" name="category">
        <option>食費</option>
        <option>外食費</option>
        <option>日用品</option>
        <option>交通費</option>
        <option>給与</option>
      </select>
    </div>

    <div>
      <label for="amount">金額</label>
      <input type="number" id="amount" name="amount" min="1" required> 円
    </div>

    <div>
      <label for="memo">メモ</label>
      <input type="text" id="memo" name="memo" maxlength="100">
    </div>

    <button type="submit">記録する</button>
  </form>
</section>
